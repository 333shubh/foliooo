<!doctype html>

    <meta charset="UTF-8" />

    <title>About · Shubh Jadiya</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#100736" />
    <script>
      if ('onpagereveal' in window) {
        const viaWindow = sessionStorage.getItem('vt') === 'window';
        sessionStorage.removeItem('vt');
        if (viaWindow) document.documentElement.classList.add('vt-window');
        addEventListener('pagereveal', (e) => {
          if (!e.viewTransition) { document.documentElement.classList.remove('vt-window'); return; }
          e.viewTransition.types.add(viaWindow ? 'window' : 'up');
          e.viewTransition.finished.finally(() => document.documentElement.classList.remove('vt-window'));
        });
      } else document.documentElement.classList.add('is-entering');
      history.scrollRestoration = 'manual';
    </script>
    <link rel="stylesheet" href="/src/ds/tokens.css" />
    <link rel="stylesheet" href="/src/ds/components.css" />
    <link rel="stylesheet" href="/src/ds/patterns.css" />
    <link rel="stylesheet" href="/src/about/about.css" />
  </head>
