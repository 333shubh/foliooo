<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work · Shubh Jadiya</title>
    <meta name="description" content="Projects by Shubh Jadiya: security tools, AI products, health apps and design systems." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#0b0724" />
    <script>
      // page transitions: from the cockpit's Work window the window itself grows into this page ('window');
      // from anywhere else the page rises from below ('up'). Old browsers fade (transitions.js).
      if ('onpagereveal' in window) {
        const viaWindow = sessionStorage.getItem('vt') === 'window';
        sessionStorage.removeItem('vt');
        if (viaWindow) document.documentElement.classList.add('vt-window');
        addEventListener('pagereveal', (e) => {
          if (!e.viewTransition) { document.documentElement.classList.remove('vt-window'); return; }
          e.viewTransition.types.add(viaWindow ? 'window' : 'up');
          e.viewTransition.finished.finally(() => document.documentElement.classList.remove('vt-window'));
        });
      } else document.documentElement.classList.add('is-entering');
    </script>
    <link rel="stylesheet" href="/src/ds/tokens.css" />
    <link rel="stylesheet" href="/src/ds/components.css" />
    <link rel="stylesheet" href="/src/ds/patterns.css" />
    <link rel="stylesheet" href="/src/work/work.css" />
  </head>
  <body class="work-page">
    <a class="skip" href="#all">Skip to the project list</a>

    <header class="site-header">
      <a class="brand" href="/#cockpit" aria-label="Shubh Jadiya, back to the cockpit">
        <svg class="brand__mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="5"/><ellipse cx="12" cy="12" rx="11" ry="4.2" transform="rotate(-24 12 12)" stroke-width="1.5"/></svg>
        Shubh Jadiya
      </a>
      <nav class="site-nav" aria-label="Main">
        <a class="link" href="/about.html">About</a>
        <a class="link" href="/work.html" aria-current="page">Work</a>
        <a class="btn btn--paper" href="/contact.html"><span class="btn__label">Say hello</span></a>
      </nav>
    </header>

    <main class="work" id="work" data-mode="hello">
      <!-- the star system: also what the cockpit's Work window shows, so the window grows into this -->
      <div class="work__stage" id="stage" data-world-stage><canvas id="gl" aria-hidden="true"></canvas></div>
      <div class="work__shade" aria-hidden="true"></div>

      <!-- landing: the title over the gallery -->
      <section class="work__hello" aria-labelledby="hello-title">
        <p class="work__kicker"><span>Work</span><span>11 projects</span></p>
        <h1 class="work__hero" id="hello-title">Things I’ve<br />built.</h1>
        <p class="work__lede">Security tools, AI products, health apps and design systems. Each one is its own world here, painted in its own colours. Fly out and visit.</p>
        <div class="work__go">
          <button class="btn btn--light" id="begin" type="button"><span class="btn__label">Start the tour</span><span class="btn__chip" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>
          <button class="link" id="all-link" type="button">or see them all</button>
        </div>
      </section>

      <!-- the current project, on an editorial column -->
      <section class="work__slide" id="slide" aria-live="polite"></section>

      <nav class="work__scrub" id="scrub" aria-label="Projects">
        <button class="work__arrow" id="prev" type="button" aria-label="Previous project"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
        <div class="work__ticks" id="ticks"></div>
        <button class="work__arrow" id="next" type="button" aria-label="Next project"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        <p class="work__count" id="count" aria-hidden="true"><b>01</b> / 11</p>
      </nav>
      <a class="work__back link" href="/#cockpit">← Cockpit</a>

      <!-- every project's own page -->
      <article class="case" id="case" hidden tabindex="-1" aria-labelledby="case-title"></article>

      <!-- everything at a glance -->
      <section class="work__all" id="all" hidden aria-labelledby="all-title">
        <div class="work__allcard">
          <div class="work__allhead"><h2 id="all-title">All projects</h2><button class="link" id="all-close" type="button">Close</button></div>
          <ol id="all-items"></ol>
        </div>
      </section>
    </main>

    <script type="module" src="/src/work/work.js"></script>
  </body>
</html>
